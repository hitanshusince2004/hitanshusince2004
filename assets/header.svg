<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1f"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#1b2a4e"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fca311"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4cc9f0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4cc9f0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .title{font:700 64px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px}
      .sub{font:500 19px 'Courier New',monospace;fill:#ffe3b0;letter-spacing:3px}
      .fade{opacity:0;animation:in 1.6s ease-out .3s forwards}
      .fade2{opacity:0;animation:in 1.6s ease-out 1.1s forwards}
      @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
      .scan{animation:scan 4s linear infinite}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(280px)}}
      .node{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
      .brk{font:700 34px 'Courier New',monospace}
    </style>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>

  <!-- git graph (left): main line + a feature branch that merges back -->
  <g fill="none" stroke="#fca311" stroke-opacity="0.35" stroke-width="2">
    <path d="M90 40 V220"/>
    <path d="M90 100 C90 125 150 115 150 140 V170 C150 195 90 185 90 200"/>
  </g>
  <g fill="#fca311">
    <circle class="node" cx="90" cy="55" r="6"/>
    <circle class="node" cx="90" cy="100" r="6" style="animation-delay:.4s"/>
    <circle class="node" cx="150" cy="140" r="6" style="animation-delay:.8s"/>
    <circle class="node" cx="150" cy="170" r="6" style="animation-delay:1.2s"/>
    <circle class="node" cx="90" cy="200" r="7" style="animation-delay:1.6s"/>
  </g>
  <text class="brk" x="200" y="150" fill="#fca311" fill-opacity="0.35">&lt;/&gt;</text>

  <!-- git graph (right, mirrored) -->
  <g fill="none" stroke="#4cc9f0" stroke-opacity="0.35" stroke-width="2">
    <path d="M1110 40 V220"/>
    <path d="M1110 100 C1110 125 1050 115 1050 140 V170 C1050 195 1110 185 1110 200"/>
  </g>
  <g fill="#4cc9f0">
    <circle class="node" cx="1110" cy="55" r="6" style="animation-delay:.2s"/>
    <circle class="node" cx="1110" cy="100" r="6" style="animation-delay:.6s"/>
    <circle class="node" cx="1050" cy="140" r="6" style="animation-delay:1s"/>
    <circle class="node" cx="1050" cy="170" r="6" style="animation-delay:1.4s"/>
    <circle class="node" cx="1110" cy="200" r="7" style="animation-delay:1.8s"/>
  </g>
  <text class="brk" x="940" y="150" fill="#4cc9f0" fill-opacity="0.35">{ }</text>

  <!-- scanning line -->
  <rect class="scan" x="0" y="0" width="1200" height="2" fill="#fca311" opacity="0.3"/>

  <text class="title fade" x="600" y="128" text-anchor="middle" fill="url(#txt)" filter="url(#glow)">Hitanshu Kanabar</text>
  <text class="sub fade2" x="600" y="176" text-anchor="middle">FULL STACK DEVELOPER  ·  DEVOPS ENTHUSIAST</text>

  <!-- bottom wave -->
  <path fill="#fca311" fill-opacity="0.10">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0 230 Q300 200 600 230 T1200 230 V260 H0Z;
              M0 230 Q300 255 600 228 T1200 232 V260 H0Z;
              M0 230 Q300 200 600 230 T1200 230 V260 H0Z"/>
  </path>
</svg>
