name: Update Stats Cards

# Generates the stats / top-languages / pinned-repo cards as static SVGs inside
# this repo, so they never depend on the rate-limited public Vercel instance.
# Docs: https://github.com/stats-organization/github-readme-stats-action

on:
  schedule:
    - cron: "0 19 * * *"   # 19:00 UTC = 12:30 AM IST
  workflow_dispatch:        # run manually from the Actions tab
  push:
    branches: [main]
    paths: [".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: '{"username":"${{ github.repository_owner }}","show_icons":true,"hide_border":true,"include_all_commits":true,"custom_title":"GitHub Stats","bg_color":"0a0f1f","title_color":"fca311","icon_color":"4cc9f0","text_color":"ffffff"}'
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: '{"username":"${{ github.repository_owner }}","layout":"compact","langs_count":6,"hide_border":true,"custom_title":"Top Languages","bg_color":"0a0f1f","title_color":"fca311","text_color":"ffffff"}'
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - Portfolio
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: '{"username":"${{ github.repository_owner }}","repo":"Portfolio","hide_border":true,"bg_color":"0a0f1f","title_color":"fca311","icon_color":"4cc9f0","text_color":"ffffff"}'
          path: profile/pin-portfolio.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - Health Card Portal
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: '{"username":"${{ github.repository_owner }}","repo":"Health-Card-Portal","hide_border":true,"bg_color":"0a0f1f","title_color":"fca311","icon_color":"4cc9f0","text_color":"ffffff"}'
          path: profile/pin-health-card.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - Music Recommendation
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: '{"username":"${{ github.repository_owner }}","repo":"My-internship-Music-Reccomandation---using-user-preferences-","hide_border":true,"bg_color":"0a0f1f","title_color":"fca311","icon_color":"4cc9f0","text_color":"ffffff"}'
          path: profile/pin-music.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Pin card - DevOps_01
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: '{"username":"${{ github.repository_owner }}","repo":"DevOps_01","hide_border":true,"bg_color":"0a0f1f","title_color":"fca311","icon_color":"4cc9f0","text_color":"ffffff"}'
          path: profile/pin-devops.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "Update stats cards"
          git pull --rebase
          git push
